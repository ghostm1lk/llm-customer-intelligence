# Intent taxonomy: every intent the model is allowed to pick, and the team it routes to.
# "null" means the intent does not decide routing on its own (it only adds context).
intents:
  Fraud Report: Fraud Team
  Unauthorized Transaction: Fraud Team
  Billing Issue: Billing Department
  Refund Request: Billing Department
  Card Issue: Account Services
  Account Access: Account Services
  Account Information: Account Services
  Loan Inquiry: Account Services
  General Inquiry: Support Team
  Complaint: null
  Unclear: null

# One-line definition per intent. These go into the LLM prompt so the model knows
# where one intent ends and the next begins. Keep the names identical to the list above.
intent_descriptions:
  Fraud Report: Customer suspects fraud, a scam or phishing, a stolen card or stolen card details, or someone trying to trick them.
  Unauthorized Transaction: A specific transaction the customer says they did NOT make or approve (unknown merchant, place or withdrawal). A duplicate of a purchase they did make is NOT this.
  Billing Issue: Wrong, duplicate or unexpected charges or fees on the customer's own purchases or account, including statement errors.
  Refund Request: Customer asks to get money back (fee refund, merchant refund, reversal of a charge).
  Card Issue: Card declined, blocked, expired, retained by an ATM, card limits, or using the card abroad or online.
  Account Access: Cannot log in, wrong or forgotten password, locked online banking, not receiving login OTP codes.
  Account Information: Account details and changes (address, phone), statements, IBAN, balances, opening or closing an account.
  Loan Inquiry: Questions about loans, interest rates, installments, loan applications, early repayment or deferral.
  General Inquiry: Branches, opening hours, money transfers, and other general questions.
  Complaint: Only when the customer EXPLICITLY shows anger or frustration (e.g. "unacceptable", "ridiculous", "third time"), complains about service or staff, or threatens to escalate. A problem described calmly is NOT a complaint.
  Unclear: Use ONLY when no other intent fits because the message is too vague or incomplete to know what the customer wants. Never combine Unclear with another intent.

# When a message has intents for several teams, the first team in this list wins.
team_order:
  - Fraud Team
  - Billing Department
  - Account Services
  - Support Team

# Used when no intent maps to a team (e.g. only "Complaint" or "Unclear").
default_team: Support Team

# Rules for the suggested action.
escalate_teams: [Fraud Team]
escalate_priorities: [High, Critical]
unclear_intent: Unclear
