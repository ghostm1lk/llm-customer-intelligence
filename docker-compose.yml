# self-hosted setup: ollama and the api as two containers.
#
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen3.5:4b
#   docker compose exec ollama ollama pull nomic-embed-text
#
# not for macs: ollama in docker can't use the apple gpu, run the ollama app natively instead.

services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama     # persist pulled models
    # uncomment on a server with an nvidia gpu
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434  # service name from above
    depends_on:
      - ollama

volumes:
  ollama_models:
